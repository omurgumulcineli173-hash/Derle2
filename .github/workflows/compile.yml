name: Pawn Derle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derleyiciyi kur
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386
          curl -fsSL "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz" -o pawnc.tar.gz
          mkdir pawnc && tar -xzf pawnc.tar.gz -C pawnc --strip-components=1
          git clone -q --depth 1 https://github.com/pawn-lang/samp-stdlib stdlib
          git clone -q --depth 1 https://github.com/pawn-lang/compiler pawnsrc
          INC=$(dirname "$(find pawnsrc -name core.inc | head -n 1)")
          echo "Include klasoru: $INC"
          echo "INC=$INC" >> $GITHUB_ENV

      - name: Derle
        run: |
          mkdir -p compiled
          export LD_LIBRARY_PATH=$PWD/pawnc/lib
          pawnc/bin/pawncc duktur.pwn -i$INC -istdlib -i. -ocompiled/duktur.amx -d3

      - name: Çıktıyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: gamemode
          path: compiled/*.amx
